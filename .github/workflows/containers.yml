name: Container acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/containers.yml'
      - 'compose.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.npmrc'
      - 'deploy/**'
      - 'services/sandbox/**'
      - 'app/**'
      - 'lib/**'
      - 'db/**'
      - 'drizzle/**'
      - 'components/**'
      - 'hooks/**'
      - 'public/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'package*.json'
      - 'next.config.ts'
      - 'postcss.config.mjs'
      - 'tsconfig.json'

permissions:
  contents: read

jobs:
  two-readers:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Build containers and verify reader and gVisor isolation
        run: bash deploy/ci-containers.sh
